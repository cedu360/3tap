# Posts do @3tapbrasil rodando sozinhos no GitHub (pedido do Carlos: não pode parar quando o Claude para).
# Mesma rotina de instagram/ROTINA.md; o token fica só no segredo IG_TOKEN do repositório.
name: Instagram

on:
  schedule: # de hora em hora (o GitHub atrasa ou pula horários); o robô decide o turno pelo relógio de Brasília
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      turno:
        description: "manha, reel1, tarde, reel2 ou noite (vazio = pelo horário)"
        required: false
      teste:
        description: "só mostrar o que sairia"
        type: boolean
        default: false

concurrency: instagram
permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar o turno
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          TURNO_MANUAL: ${{ inputs.turno }}
          TESTE: ${{ inputs.teste && '--teste' || '' }}
        run: |
          T="${TURNO_MANUAL:-auto}"
          node instagram/publicar.mjs $T $TESTE
      - name: Guardar o que já saiu (estado.json)
        if: always()
        run: |
          git config user.name "3tap-bot"
          git config user.email "cedu.live@gmail.com"
          git add instagram/estado.json
          git diff --cached --quiet || (git commit -m "Instagram: estado depois do turno [skip ci]" && git pull --rebase -q origin main && git push -q origin HEAD:main)
